version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_automatize_mei
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-automatize_mei}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: