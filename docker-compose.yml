version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_automatize_mei
    restart: always
    environment:
      POSTGRES_DB: automatize_mei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: duda123456
      
    ports:
      - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: